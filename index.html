<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:#030303;font-family:'Jost',sans-serif;color:#fff}
::selection{background:rgba(212,175,55,.35);color:#fff}

/* ====== FON QATLAMLARI ====== */
#bgFx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#magicCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99998}

.vp{
  width:100vw;height:100vh;height:100dvh;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(212,175,55,.16) 0%, transparent 60%),
    radial-gradient(circle at 50% 32%, #1c160b 0%, #0a0805 58%, #020202 100%);
}
.vp::after{ /* vinyetka + nozik don */
  content:'';position:absolute;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%);
}
/* aylanuvchi nur konusi — kichraytirilgan qatlam (GPU xotirasi uchun) */
.rays{position:absolute;left:50%;top:38%;width:120vmax;height:120vmax;transform:translate(-50%,-50%) translateZ(0);z-index:0;pointer-events:none;opacity:.30;
  background:conic-gradient(from 0deg, rgba(212,175,55,.16) 0deg, transparent 26deg, rgba(212,175,55,.10) 52deg, transparent 84deg, rgba(212,175,55,.14) 120deg, transparent 160deg, rgba(212,175,55,.09) 210deg, transparent 250deg, rgba(212,175,55,.13) 300deg, transparent 340deg);
  -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 62%);
  mask-image:radial-gradient(circle, #000 0%, transparent 62%);
  animation:spin 90s linear infinite;will-change:transform}
@keyframes spin{to{transform:translate(-50%,-50%) translateZ(0) rotate(360deg)}}

.reel{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.22,1,.28,1);will-change:transform;z-index:4}
.reel.dragging{transition:none}

.sc{width:100%;flex:0 0 100%;height:100%;position:relative;overflow:hidden;perspective:1100px}
.sc-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px;text-align:center;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,1,.3,1);will-change:transform;z-index:3}
.sc::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 46%, rgba(212,175,55,.09) 0%, transparent 72%)}
.sc::after{content:'';position:absolute;inset:12px;border:1px solid rgba(212,175,55,.22);border-radius:5px;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 40px rgba(212,175,55,.06)}

.sc-c{position:absolute;width:52px;height:52px;pointer-events:none;filter:drop-shadow(0 0 7px rgba(212,175,55,.45));z-index:4}
.sc-c.tl{top:16px;left:16px}.sc-c.tr{top:16px;right:16px}
.sc-c.bl{bottom:16px;left:16px}.sc-c.br{bottom:16px;right:16px}
.sc-c path{stroke-dasharray:60;stroke-dashoffset:60;animation:drawIn 1.4s .25s cubic-bezier(.2,1,.3,1) forwards}
@keyframes drawIn{to{stroke-dashoffset:0}}

.ai{opacity:0;transform:translateY(26px) scale(.985);
  transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.ai.vis{opacity:1;transform:translateY(0) scale(1)}

.dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:11px;z-index:60}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);border:1.5px solid rgba(212,175,55,.45);transition:all .45s cubic-bezier(.2,1,.3,1);cursor:pointer}
.dot.on{background:#D4AF37;border-color:#FFF9E0;transform:scale(1.5);box-shadow:0 0 14px #D4AF37}

/* TEPAGA SURING */
#shint{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  color:#FFF;font-weight:700;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;
  padding:9px 20px;background:rgba(15,12,5,.9);border:1px solid rgba(212,175,55,.6);border-radius:30px;
  box-shadow:0 4px 22px rgba(0,0,0,.6), 0 0 16px rgba(212,175,55,.35);
  z-index:9000;animation:vipPulse 2.2s cubic-bezier(.4,0,.6,1) infinite;pointer-events:none;
  display:flex;align-items:center;gap:9px}
#shint .arw{display:inline-block;animation:arwUp 1.5s ease-in-out infinite}
@keyframes arwUp{0%,100%{transform:translateY(2px);opacity:.6}50%{transform:translateY(-3px);opacity:1}}
@keyframes vipPulse{
  0%,100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  50%{opacity:.8;transform:translateX(-50%) translateY(-7px) scale(1.03)}
}

/* ====== TIPOGRAFIKA ====== */
.s-eye{font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:#E8C86A;margin-bottom:8px;text-shadow:0 0 14px rgba(212,175,55,.5)}

.s-names{font-family:'Great Vibes',cursive;font-size:3.5rem;line-height:1.14;
  background:linear-gradient(104deg,#9a7b23 0%,#F3DE93 28%,#FFFDF4 47%,#F7E396 62%,#9a7b23 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:shine 7s linear infinite}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:260% 50%}}
.s-amp{font-family:'Playfair Display',serif;font-size:1.05rem;display:block;margin:2px 0;font-style:italic;
  -webkit-text-fill-color:#D4AF37;color:#D4AF37}

.s-div{display:flex;align-items:center;gap:10px;margin:12px auto;width:min(170px,78%)}
.s-dl{flex:1;height:1px;background:linear-gradient(90deg,transparent,#D4AF37,transparent);opacity:.65}

.s-text{font-family:'Cormorant Garamond',serif;font-size:1.12rem;color:#EDE6D8;line-height:1.7;max-width:300px;font-style:italic;text-wrap:pretty}
.s-rsvp{font-family:'Cormorant Garamond',serif;font-size:1.06rem;color:#EDE6D8;line-height:1.65;max-width:300px;text-wrap:pretty}
.s-venue{font-size:.9rem;color:#F7E396;margin-top:7px;font-weight:500;max-width:290px;text-wrap:pretty}

.s-loc{display:inline-flex;align-items:center;gap:8px;margin-top:13px;padding:9px 19px;
  background:linear-gradient(135deg,rgba(212,175,55,.22),rgba(212,175,55,.08));
  border:1px solid rgba(212,175,55,.5);border-radius:26px;font-size:.78rem;font-weight:600;color:#FFF;
  letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 6px 20px rgba(0,0,0,.4), 0 0 0 0 rgba(212,175,55,.5);transition:all .25s ease;position:relative;overflow:hidden}
.s-loc::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);
  animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
.s-loc:active{transform:scale(.95);box-shadow:0 0 26px rgba(212,175,55,.55)}

.s-guest{font-family:'Great Vibes',cursive;font-size:3rem;color:#D4AF37;margin:4px 0;text-shadow:0 0 18px rgba(212,175,55,.55)}
.s-big{font-family:'Cinzel',serif;font-size:1.22rem;font-weight:700;letter-spacing:.11em;color:#FFF;line-height:1.5;text-shadow:0 0 14px rgba(255,240,200,.35)}

.s-sig{font-family:'Jost',sans-serif;font-size:.86rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#EBCD74;
  margin-top:18px;padding:11px 16px;background:linear-gradient(135deg,rgba(212,175,55,.16) 0%,rgba(0,0,0,.55) 100%);
  border:1px solid rgba(212,175,55,.42);border-radius:9px;
  box-shadow:0 6px 24px rgba(0,0,0,.6), inset 0 0 14px rgba(212,175,55,.14);
  text-shadow:0 0 12px rgba(212,175,55,.6);line-height:1.55;max-width:320px}

/* ORNAMENT / MONOGRAMMA */
.s-orn{width:104px;height:104px;margin-bottom:10px;position:relative;animation:float 4.5s ease-in-out infinite}
.s-orn svg{width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(212,175,55,.6))}
.s-orn::before{content:'';position:absolute;inset:-30%;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.3),transparent 65%);animation:halo 4s ease-in-out infinite;z-index:-1}
@keyframes halo{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.mono-ring{transform-origin:center;animation:monoSpin 26s linear infinite}
.mono-ring.rev{animation-direction:reverse;animation-duration:34s}
@keyframes monoSpin{to{transform:rotate(360deg)}}

/* KALENDAR */
.mcal{background:rgba(18,15,10,.85);border:1px solid rgba(212,175,55,.32);border-radius:13px;padding:12px 14px;width:236px;margin:12px auto 0;
  box-shadow:0 10px 34px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05)}
.mcal-m{font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;color:#E8C86A;text-align:center;margin-bottom:8px;letter-spacing:.1em}
.mcal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cd{font-size:.68rem;color:#D6CBBB;opacity:.8;padding:4px 0;border-radius:50%}
.cd.wd{font-size:.62rem;color:#D4AF37;font-weight:700;opacity:1;padding-bottom:6px}
.cd.bk{visibility:hidden}
.cd.hi{background:radial-gradient(circle at 35% 30%,#FFF0B8,#D4AF37 70%);color:#1a1206;font-weight:700;opacity:1;border-radius:50%;
  box-shadow:0 0 0 0 rgba(212,175,55,.6);animation:dayPulse 2.4s ease-out infinite}
@keyframes dayPulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.55)}70%,100%{box-shadow:0 0 0 12px rgba(212,175,55,0)}}

/* COUNTDOWN */
.s-cd{display:flex;gap:6px;justify-content:center;margin-top:15px}
.s-cb{background:linear-gradient(180deg,rgba(38,31,17,.92) 0%,rgba(10,8,5,.92) 100%);
  border:1px solid rgba(212,175,55,.34);color:#fff;width:56px;height:56px;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden}
.s-cb::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(247,227,150,.8),transparent)}
.s-cn{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:#F7E396;line-height:1}
.s-cl{font-size:.42rem;letter-spacing:.1em;color:rgba(255,255,255,.6);margin-top:3px;text-transform:uppercase}
.s-cd-sep{color:#D4AF37;font-size:.8rem;opacity:.55;align-self:center;margin-bottom:6px;font-weight:300}

/* SANA KARTASI */
.s-date-card{display:flex;align-items:center;gap:14px;margin:13px auto 6px;
  background:linear-gradient(135deg,rgba(30,24,13,.88),rgba(12,10,6,.88));
  border:1px solid rgba(212,175,55,.34);border-radius:12px;padding:11px 20px;
  box-shadow:0 8px 26px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05)}
.s-day-num{font-family:'Playfair Display',serif;font-size:2.85rem;font-weight:700;line-height:1;padding-right:15px;
  border-right:1px solid rgba(212,175,55,.28);
  background:linear-gradient(160deg,#FFF6D4,#D4AF37 60%,#8f7118);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.s-date-r{display:flex;flex-direction:column;gap:3px;text-align:left}
.s-month-nm{font-size:.68rem;font-weight:700;letter-spacing:.2em;color:#FFF;text-transform:uppercase}
.s-year-nm{font-size:.58rem;color:#D4AF37;opacity:.85;letter-spacing:.12em}

.s-time-pill{font-size:.72rem;color:#FFF;letter-spacing:.18em;font-weight:600;margin-bottom:4px;
  background:rgba(212,175,55,.15);padding:5px 13px;border-radius:12px;border:1px solid rgba(212,175,55,.3)}

.sc-topband{display:flex;align-items:center;gap:7px;width:74%;margin-bottom:8px}
.sc-tbl{flex:1;height:1px;background:linear-gradient(90deg,transparent,#D4AF37,transparent);opacity:.5}

.music-btn{position:fixed;bottom:22px;right:20px;width:46px;height:46px;border-radius:50%;
  background:rgba(15,12,5,.88);border:1px solid rgba(212,175,55,.5);color:#E8C86A;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:9100;
  box-shadow:0 4px 16px rgba(0,0,0,.5), 0 0 14px rgba(212,175,55,.28)}
.music-btn.on::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(212,175,55,.35);animation:mPulse 1.8s ease-out infinite}
@keyframes mPulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}

/* ====== OCHILISH PARDASI ====== */
#gate{position:fixed;inset:0;z-index:99000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(circle at 50% 42%,#1b1509 0%,#080604 58%,#010101 100%);
  transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.7,0,.2,1)}
#gate.gone{opacity:0;transform:scale(1.14);pointer-events:none}
.gate-mono{width:172px;height:172px;position:relative;filter:drop-shadow(0 0 22px rgba(212,175,55,.55))}
.gate-mono svg{width:100%;height:100%}
.gate-mono .dr{stroke-dasharray:520;stroke-dashoffset:520;animation:drawIn 2.4s .2s cubic-bezier(.2,1,.3,1) forwards}
.gate-names{font-family:'Great Vibes',cursive;font-size:2.1rem;
  background:linear-gradient(104deg,#9a7b23,#FFF7DC 45%,#9a7b23);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;animation:fadeUp 1.2s 1.1s ease forwards}
.gate-sub{font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:.4em;color:#B99C4A;text-transform:uppercase;opacity:0;animation:fadeUp 1.2s 1.4s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.gate-btn{margin-top:6px;font-family:'Jost',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#0f0b03;
  padding:14px 30px;border:none;border-radius:30px;cursor:pointer;
  background:linear-gradient(135deg,#F7E396,#D4AF37 55%,#F7E396);
  box-shadow:0 10px 30px rgba(0,0,0,.6), 0 0 26px rgba(212,175,55,.5);
  opacity:0;animation:fadeUp 1s 1.75s ease forwards, btnGlow 2.6s 2.8s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.6), 0 0 22px rgba(212,175,55,.45)}50%{box-shadow:0 10px 34px rgba(0,0,0,.6), 0 0 40px rgba(212,175,55,.8)}}
.gate-btn:active{transform:scale(.96)}

@media (max-height:640px){
  .s-names{font-size:2.9rem}.s-orn{width:88px;height:88px}.mcal{width:220px;padding:10px 12px}
  .s-cb{width:50px;height:50px}.s-day-num{font-size:2.4rem}.sc-inner{padding:40px 20px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>

<script>

var MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];

var playing=false,cdTmr=null,cur=0,total=3;

function e(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ====== U & E MONOGRAMMA ====== */

}
document.getElementById('gateMono').innerHTML=monogram(true);

function crnrs(){
  return'<svg class="sc-c tl" viewBox="0 0 60 60" fill="none"><path d="M4 30 L4 4 L30 4" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity=".75"/><path d="M4 14 Q14 14 14 4" stroke="#D4AF37" stroke-width="1" opacity=".5"/><circle cx="4" cy="4" r="2" fill="#F7E396"/></svg>'
  +'<svg class="sc-c tr" viewBox="0 0 60 60" fill="none"><path d="M56 30 L56 4 L30 4" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity=".75"/><path d="M56 14 Q46 14 46 4" stroke="#D4AF37" stroke-width="1" opacity=".5"/><circle cx="56" cy="4" r="2" fill="#F7E396"/></svg>'
  +'<svg class="sc-c bl" viewBox="0 0 60 60" fill="none"><path d="M4 30 L4 56 L30 56" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity=".75"/><path d="M4 46 Q14 46 14 56" stroke="#D4AF37" stroke-width="1" opacity=".5"/><circle cx="4" cy="56" r="2" fill="#F7E396"/></svg>'

function cal(ds){
  if(!ds)return'';
  var d=new Date(ds+'T00:00:00'),m=d.getMonth(),y=d.getFullYear(),day=d.getDate();
  var off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  var h='<div class="mcal-m">'+MONTHS[m]+' '+y+'</div><div class="mcal-g">';
  ['Du','Se','Ch','Pa','Ju','Sh','Ya'].forEach(function(dw){h+='<div class="cd wd">'+dw+'</div>'});
  for(var i=0;i<off;i++)h+='<div class="cd bk">.</div>';
  for(var j=1;j<=dim;j++)h+='<div class="cd'+(j===day?' hi':'')+'">'+j+'</div>';
  return h+'</div>';
}

function cdh(){
  var t=new Date(D.date+'T'+(D.time||'14:00')+':00').getTime();
  var df=Math.max(0,t-Date.now());
  var vs=[Math.floor(df/86400000),Math.floor(df%86400000/3600000),Math.floor(df%3600000/60000),Math.floor(df%60000/1000)];
  var ls=['Kun','Soat','Daqiqa','Soniya'];
  return vs.map(function(nn,i){return'<div class="s-cb"><span class="s-cn">'+String(nn).padStart(2,'0')+'</span><span class="s-cl">'+ls[i]+'</span></div>'}).join('<span class="s-cd-sep">&middot;</span>');
}

function fdp(ds){

    +'<div class="s-eye ai">'+e(D.eye)+'</div>'+sdiv()

var reel=document.getElementById('reel');

var dotsEl=document.getElementById('dots');
for(var di=0;di<total;di++){var dd=document.createElement('div');dd.className='dot'+(di===0?' on':'');dd.dataset.i=di;dotsEl.appendChild(dd)}
dotsEl.addEventListener('click',function(ev){var t=ev.target;if(t.dataset.i!==undefined)goTo(+t.dataset.i)});

function updDots(){var ds=dotsEl.children;for(var i=0;i<ds.length;i++){ds[i].classList.toggle('on',i===cur)}}

function goTo(n){
  if(n<0||n>=total)return;
  cur=n;
  reel.style.transform='translateY(-'+(cur*100)+'%)';
  reel.classList.remove('dragging');
  updDots();
  animateScene(n);
  clearInterval(cdTmr);
  if(n===1){cdTmr=setInterval(function(){var b=document.getElementById('cdbox');if(b)b.innerHTML=cdh()},1000)}
  var hint=document.getElementById('shint');

function animateScene(n){
  var scenes=reel.querySelectorAll('.sc');
  if(!scenes[n])return;
  var items=scenes[n].querySelectorAll('.ai');
  items.forEach(function(el,i){
    el.classList.remove('vis');

/* ====== 3D PARALLAKS — rAF bilan cheklangan, faqat ko'rinayotgan sahna ====== */
var tiltPend=false,tiltRx=0,tiltRy=0;
function applyTilt(rx,ry){
  tiltRx=rx;tiltRy=ry;
  if(tiltPend)return;
  tiltPend=true;
  requestAnimationFrame(function(){
    tiltPend=false;
    var inn=reel.querySelectorAll('.sc-inner')[cur];
    if(inn)inn.style.transform='rotateX('+tiltRx.toFixed(2)+'deg) rotateY('+tiltRy.toFixed(2)+'deg) translateZ(0)';
  });
}
window.addEventListener('mousemove',function(ev){
  var nx=(ev.clientX/innerWidth-.5),ny=(ev.clientY/innerHeight-.5);
  applyTilt(-ny*7,nx*8);
});
window.addEventListener('deviceorientation',function(ev){
  if(ev.gamma==null)return;
  applyTilt(Math.max(-8,Math.min(8,(ev.beta-40)*0.14)),Math.max(-8,Math.min(8,ev.gamma*0.18)));
});

/* ====== SVAYP / NAVIGATSIYA ====== */
var ty0=0,ty1=0,isDragging=false;
reel.addEventListener('touchstart',function(ev){
  ty0=ev.touches[0].clientY;ty1=ty0;isDragging=true;
  reel.classList.add('dragging');
},{passive:true});
reel.addEventListener('touchmove',function(ev){
  if(!isDragging)return;
  ty1=ev.touches[0].clientY;
  var dy=ty1-ty0;
  var base=cur*reel.parentElement.offsetHeight;
  reel.style.transform='translateY('+(-base+dy*0.9)+'px)';
},{passive:true});
reel.addEventListener('touchend',function(){
  if(!isDragging)return;
  isDragging=false;
  var dy=ty1-ty0;
  if(Math.abs(dy)>50){
    if(dy<0&&cur<total-1)goTo(cur+1);
    else if(dy>0&&cur>0)goTo(cur-1);
    else goTo(cur);
  }else{goTo(cur)}
  ty0=0;ty1=0;
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='ArrowDown'||ev.key===' '){ev.preventDefault();if(cur<total-1)goTo(cur+1)}
  else if(ev.key==='ArrowUp'){ev.preventDefault();if(cur>0)goTo(cur-1)}
});
var whl=false;
document.addEventListener('wheel',function(ev){
  ev.preventDefault();
  if(whl)return;whl=true;
  if(ev.deltaY>0&&cur<total-1)goTo(cur+1);
  else if(ev.deltaY<0&&cur>0)goTo(cur-1);
  setTimeout(function(){whl=false},650);
},{passive:false});

var bgm=document.getElementById('bgm'),mbEl=document.getElementById('mb');

}
function loud(){bgm.muted=false;var p;try{p=bgm.play()}catch(err){return Promise.reject(err)}return(p&&p.then)?p:Promise.resolve()}
function tgl(){
  if(!bgm.paused&&!bgm.muted){bgm.pause();playing=false;icon();return}
  loud().then(function(){playing=true;icon()}).catch(function(){icon()});
}
var KEV=['pointerdown','pointerup','touchstart','touchend','click','keydown','wheel'],kt=null;
function stopKick(){KEV.forEach(function(ev){document.removeEventListener(ev,kick,true);window.removeEventListener(ev,kick,true)});if(kt){clearInterval(kt);kt=null}}
function kick(){if(!bgm.paused&&!bgm.muted){stopKick();return}loud().then(function(){playing=true;icon();stopKick()}).catch(function(){})}
window.kick=kick;
KEV.forEach(function(ev){document.addEventListener(ev,kick,{capture:true,passive:true});window.addEventListener(ev,kick,{capture:true,passive:true})});
document.addEventListener('visibilitychange',function(){if(!document.hidden)kick()});
window.addEventListener('focus',kick);
loud().then(function(){playing=true;icon()}).catch(function(){
  bgm.muted=true;var q=bgm.play();if(q&&q.catch)q.catch(function(){});
  icon();

});

/* ====== FANTASTIK FON — optimallashtirilgan versiya ======
   - shadowBlur har kadrdan olib tashlandi (spritelarga oldindan "pishirilgan")
   - zarralar soni kamaytirildi, dpr 1.5 bilan cheklandi
   - avtomatik sifat nazorati: sekin qurilmada effektlar o'zi yengillashadi
   - sahifa yashiringanda animatsiya to'xtaydi (batareya) */
var FX=(function(){
  var cv=document.getElementById('bgFx'),ctx=cv.getContext('2d');
  var W=0,H=0,dpr=1;
  var rings=[],dust=[],stars=[],hearts=[],bokeh=[],shoot=null,t=0;
  var dustSprite=null,glowSprite=null,starSprite=null,heartSprite=null,trailG=null,trailW=null;
  var TIER=0; // 0=to'liq, 1=yengil, 2=minimal

  function sprite(c1,c2,size){
    var c=document.createElement('canvas');c.width=c.height=size;
    var g=c.getContext('2d'),gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    gr.addColorStop(0,c1);gr.addColorStop(.35,c2);gr.addColorStop(1,'rgba(212,175,55,0)');
    g.fillStyle=gr;g.fillRect(0,0,size,size);return c;
  }
  function bakeStar(){ /* yulduz — porlashi oldindan chizilgan */
    var s=28,c=document.createElement('canvas');c.width=c.height=s*2+24;
    var g=c.getContext('2d');g.translate(s+12,s+12);
    g.fillStyle='rgba(255,250,225,1)';g.shadowBlur=12;g.shadowColor='rgba(212,175,55,.9)';
    g.beginPath();
    g.moveTo(0,-s);g.quadraticCurveTo(s*.16,-s*.16,s,0);
    g.quadraticCurveTo(s*.16,s*.16,0,s);g.quadraticCurveTo(-s*.16,s*.16,-s,0);
    g.quadraticCurveTo(-s*.16,-s*.16,0,-s);g.fill();
    return c;
  }
  function bakeHeart(){
    var c=document.createElement('canvas');c.width=c.height=72;
    var g=c.getContext('2d');g.translate(36,36);g.scale(1.5,1.5);
    g.fillStyle='rgba(212,175,55,1)';g.shadowBlur=10;g.shadowColor='rgba(212,175,55,.7)';
    g.beginPath();
    g.moveTo(0,8);g.bezierCurveTo(-12,-4,-9,-16,0,-8);g.bezierCurveTo(9,-16,12,-4,0,8);
    g.fill();
    return c;
  }
  function bakeTrail(){ /* teginish izi zarralari */
    trailG=sprite('rgba(241,206,99,1)','rgba(212,175,55,.6)',24);
    trailW=sprite('rgba(255,253,242,1)','rgba(255,246,216,.6)',24);
  }
  function R(a,b){return a+Math.random()*(b-a)}

  function seed(){
    rings=[];dust=[];stars=[];hearts=[];bokeh=[];
    var small=W<520;
    var n=(small?4:6)>>TIER;
    for(var i=0;i<n;i++)rings.push({x:R(0,W),y:R(0,H*1.4),r:R(14,42),sp:R(.12,.42),dx:R(-.18,.18),
      rot:R(0,6.28),vr:R(-.006,.006),tp:R(0,6.28),vt:R(.006,.016),op:R(.22,.6),lw:R(1.1,2.4),pair:Math.random()>.45});
    var dn=(small?40:70)>>TIER;
    for(var j=0;j<dn;j++)dust.push({x:R(0,W),y:R(0,H),s:R(.6,2.6),sp:R(.15,.75),dx:R(-.25,.25),op:R(.15,.75),ph:R(0,6.28),vp:R(.01,.04)});
    var sn=(small?10:16)>>TIER;
    for(var k=0;k<sn;k++)stars.push({x:R(0,W),y:R(0,H),s:R(4,11),sp:R(.08,.3),ph:R(0,6.28),vp:R(.02,.055),rot:R(0,6.28)});
    if(TIER<2)for(var m=0;m<(5>>TIER);m++)hearts.push({x:R(0,W),y:R(0,H*1.3),s:R(7,15),sp:R(.16,.4),dx:R(-.2,.2),rot:R(-.4,.4),vr:R(-.004,.004),op:R(.18,.45)});
    for(var b=0;b<(5>>TIER);b++)bokeh.push({x:R(0,W),y:R(0,H),r:R(50,150),sp:R(.05,.16),dx:R(-.1,.1),op:R(.05,.14)});
  }
  function resize(){
    W=window.innerWidth;H=window.innerHeight;
    dpr=TIER>0?1:Math.min(1.5,window.devicePixelRatio||1);
    cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
    cv.style.width=W+'px';cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dustSprite=sprite('rgba(255,248,214,1)','rgba(212,175,55,.55)',36);
    glowSprite=sprite('rgba(255,255,255,.9)','rgba(212,175,55,.5)',64);
    starSprite=bakeStar();heartSprite=bakeHeart();bakeTrail();
    seed();
  }
  window.addEventListener('resize',resize);

  function degrade(){ /* sekin qurilmalar uchun avtomatik yengillashtirish */
    if(TIER>=2)return;
    TIER++;
    resize();
    if(TIER>=2){var ry=document.querySelector('.rays');if(ry)ry.style.display='none'}
  }

  function drawRing(o){
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    var sq=Math.abs(Math.cos(o.tp))*.92+.08;
    ctx.scale(1,sq);
    /* porlash: shadowBlur o'rniga keng, xira ikkinchi chiziq (arzon) */
    ctx.strokeStyle='rgba(212,175,55,'+(o.op*.3)+')';ctx.lineWidth=o.lw*3;
    ctx.beginPath();ctx.arc(0,0,o.r,0,6.2832);ctx.stroke();
    var g=ctx.createLinearGradient(-o.r,-o.r,o.r,o.r);
    g.addColorStop(0,'rgba(143,113,24,'+o.op+')');
    g.addColorStop(.45,'rgba(247,227,150,'+Math.min(1,o.op*1.5)+')');
    g.addColorStop(1,'rgba(180,143,45,'+o.op*.7+')');
    ctx.strokeStyle=g;ctx.lineWidth=o.lw;
    ctx.beginPath();ctx.arc(0,0,o.r,0,6.2832);ctx.stroke();
    ctx.restore();
    if(o.pair){
      ctx.save();ctx.translate(o.x+o.r*1.15,o.y+o.r*.28);ctx.rotate(-o.rot*.8);
      ctx.scale(1,Math.abs(Math.sin(o.tp))*.9+.1);
      ctx.strokeStyle='rgba(212,175,55,'+(o.op*.25)+')';ctx.lineWidth=o.lw*2.5;
      ctx.beginPath();ctx.arc(0,0,o.r*.8,0,6.2832);ctx.stroke();
      ctx.strokeStyle='rgba(247,227,150,'+(o.op*.85)+')';ctx.lineWidth=o.lw*.85;
      ctx.beginPath();ctx.arc(0,0,o.r*.8,0,6.2832);ctx.stroke();ctx.restore();
    }
  }
  function drawStar(o){
    var tw=(Math.sin(o.ph)*.5+.5),a=.18+tw*.72,s=o.s*(.7+tw*.5);
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    ctx.globalAlpha=a;
    ctx.drawImage(starSprite,-s-6,-s-6,(s+6)*2,(s+6)*2);
    ctx.restore();ctx.globalAlpha=1;
  }
  function drawHeart(o){
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    ctx.globalAlpha=o.op;
    var w=o.s*2.4;
    ctx.drawImage(heartSprite,-w/2,-w/2,w,w);
    ctx.restore();ctx.globalAlpha=1;
  }

  var trail=[],TRAILMAX=140;
  function addTrail(x,y,n){
    if(trail.length>TRAILMAX)return;
    for(var i=0;i<(n||3);i++)trail.push({x:x,y:y,vx:R(-1.3,1.3),vy:R(-1.9,.6),s:R(1.4,4.2),a:1,gold:Math.random()>.3});
  }
  function burst(x,y,n){
    for(var i=0;i<(n||30)>>TIER;i++){var an=R(0,6.28),sp=R(1,7);
      trail.push({x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-1,s:R(1.5,4.6),a:1,gold:Math.random()>.25})}
  }
  function rain(){
    var i=0,iv=setInterval(function(){
      for(var k=0;k<(TIER>0?4:8);k++)trail.push({x:R(0,W),y:-10,vx:R(-.4,.4),vy:R(1.6,4),s:R(1.2,3.4),a:1,gold:Math.random()>.2});
      if(++i>26)clearInterval(iv);
    },70);
  }
  var lastTrailT=0;
  window.addEventListener('mousemove',function(ev){
    var now=performance.now();
    if(now-lastTrailT<40)return;lastTrailT=now;
    addTrail(ev.clientX,ev.clientY,2);
  });
  window.addEventListener('touchmove',function(ev){
    var now=performance.now();
    if(now-lastTrailT<40)return;lastTrailT=now;
    if(ev.touches.length)addTrail(ev.touches[0].clientX,ev.touches[0].clientY,2);
  },{passive:true});
  window.addEventListener('touchstart',function(ev){if(ev.touches.length)burst(ev.touches[0].clientX,ev.touches[0].clientY,12)},{passive:true});
  window.addEventListener('click',function(ev){burst(ev.clientX,ev.clientY,16)});

  /* FPS nazoratchisi */
  var lastFrame=performance.now(),slowCnt=0;

  function frame(){
    if(document.hidden){requestAnimationFrame(frame);return}
    var now=performance.now(),dt=now-lastFrame;lastFrame=now;
    if(dt>36&&dt<500){if(++slowCnt>40){slowCnt=0;degrade()}}
    else if(slowCnt>0)slowCnt--;

    t++;
    ctx.clearRect(0,0,W,H);

    ctx.globalCompositeOperation='lighter';
    for(var b=0;b<bokeh.length;b++){var o=bokeh[b];
      o.y-=o.sp;o.x+=o.dx;if(o.y<-o.r)o.y=H+o.r;
      ctx.globalAlpha=o.op;ctx.drawImage(glowSprite,o.x-o.r,o.y-o.r,o.r*2,o.r*2);
    }
    ctx.globalAlpha=1;
    for(var d=0;d<dust.length;d++){var p=dust[d];
      p.y-=p.sp;p.x+=p.dx+Math.sin((t+p.ph*40)*.008)*.25;p.ph+=p.vp;
      if(p.y<-8){p.y=H+8;p.x=R(0,W)}
      var al=p.op*(.55+Math.sin(p.ph)*.45),sz=p.s*7;
      ctx.globalAlpha=Math.max(0,al);
      ctx.drawImage(dustSprite,p.x-sz/2,p.y-sz/2,sz,sz);
    }
    ctx.globalAlpha=1;
    for(var s=0;s<stars.length;s++){var st=stars[s];st.ph+=st.vp;st.y-=st.sp;st.rot+=.004;
      if(st.y<-20){st.y=H+20;st.x=R(0,W)}drawStar(st)}
    for(var h=0;h<hearts.length;h++){var ht=hearts[h];ht.y-=ht.sp;ht.x+=ht.dx+Math.sin(t*.006+h)*.3;ht.rot+=ht.vr;
      if(ht.y<-30){ht.y=H+30;ht.x=R(0,W)}drawHeart(ht)}
    for(var r=0;r<rings.length;r++){var rg=rings[r];
      rg.y-=rg.sp;rg.x+=rg.dx+Math.sin(t*.004+r)*.25;rg.rot+=rg.vr;rg.tp+=rg.vt;
      if(rg.y<-rg.r*2.4){rg.y=H+rg.r*2.4;rg.x=R(0,W)}drawRing(rg)}

    /* uchar yulduz */
    if(!shoot&&TIER<2&&Math.random()<.004)shoot={x:R(0,W*.7),y:R(0,H*.4),vx:R(5,9),vy:R(2.4,4.4),life:1};
    if(shoot){
      shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.life-=.014;
      ctx.save();ctx.globalAlpha=Math.max(0,shoot.life);
      var gd=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*16,shoot.y-shoot.vy*16);
      gd.addColorStop(0,'rgba(255,252,235,.95)');gd.addColorStop(1,'rgba(212,175,55,0)');
      ctx.strokeStyle=gd;ctx.lineWidth=2;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(shoot.x-shoot.vx*16,shoot.y-shoot.vy*16);ctx.stroke();
      ctx.restore();
      if(shoot.life<=0||shoot.x>W+80||shoot.y>H+80)shoot=null;
    }

    /* teginish izi — sprite bilan, shadowBlur yo'q */
    for(var i=trail.length-1;i>=0;i--){
      var q=trail[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.035;q.a-=.017;
      if(q.a<=0){trail.splice(i,1);continue}
      ctx.globalAlpha=q.a;
      var sp2=q.s*4;
      ctx.drawImage(q.gold?trailG:trailW,q.x-sp2/2,q.y-sp2/2,sp2,sp2);
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(frame);
  }
  resize();frame();
  return {burst:burst,rain:rain};
})();
window.FX=FX;

/* eski magicCanvas endi FX tomonidan boshqariladi */
var mc=document.getElementById('magicCanvas');if(mc)mc.style.display='none';

goTo(0);
</script>
