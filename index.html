<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<title>TO'Y TAKLIFNOMASI | Umidjon &amp; Ezozaxon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:#030303;font-family:'Jost',sans-serif;color:#fff}

#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
}

.vp{
  width:100vw;
  height:100vh;
  height:100dvh;
  position:relative;
  overflow:hidden;
  background: radial-gradient(circle at 50% 30%, #1a140a 0%, #080604 60%, #020202 100%) !important;
  z-index: 2;
}

.reel{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.25,1,.35,1);will-change:transform}
.reel.dragging{transition:none}

.sc{
  width:100%;
  flex:0 0 100%;
  height:100%;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:48px 24px;
  text-align:center;
  overflow:hidden;
}

.sc-c{position:absolute;width:50px;height:50px;pointer-events:none;filter:drop-shadow(0 0 6px rgba(212,175,55,0.4));z-index:4}
.sc-c.tl{top:16px;left:16px}.sc-c.tr{top:16px;right:16px}
.sc-c.bl{bottom:16px;left:16px}.sc-c.br{bottom:16px;right:16px}

.ai{opacity:0;transform:translateY(22px);transition:opacity .75s cubic-bezier(.16,1,.3,1),transform .75s cubic-bezier(.16,1,.3,1)}
.ai.vis{opacity:1;transform:translateY(0)}

.dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:50}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);border:1.5px solid rgba(212,175,55,.4);transition:all .4s ease;cursor:pointer}
.dot.on{background:#D4AF37;border-color:#FFF;transform:scale(1.4);box-shadow:0 0 10px #D4AF37}

/* VIP SWIPE HINT */
#shint, .swipe-hint {
  position: fixed !important;
  bottom: 25px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  color: #FFFFFF !important;
  font-weight: 700 !important;
  font-size: 0.82rem !important;
  letter-spacing: 0.22em !important;
  text-transform: uppercase !important;
  padding: 8px 20px !important;
  background: rgba(15, 12, 5, 0.85) !important;
  border: 1px solid rgba(212, 175, 55, 0.6) !important;
  border-radius: 30px !important;
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 15px rgba(212,175,55,0.4) !important;
  z-index: 9999 !important;
  animation: vipPulse 2.2s cubic-bezier(.4,0,.6,1) infinite !important;
  pointer-events: none !important;
}

@keyframes vipPulse{
  0%,100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);box-shadow:0 4px 20px rgba(0,0,0,0.6), 0 0 15px rgba(212,175,55,0.4)}
  50%{opacity:.75;transform:translateX(-50%) translateY(-8px) scale(1.03);box-shadow:0 6px 25px rgba(0,0,0,0.8), 0 0 22px rgba(212,175,55,0.7)}
}

.s-eye{
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #D4AF37;
  margin-bottom: 8px;
  text-shadow: 0 0 12px rgba(212,175,55,0.5);
}

.s-names{
  font-family: 'Great Vibes', cursive;
  color: #FFF;
  font-size: 3.6rem;
  line-height: 1.15;
  text-shadow: 0 0 25px rgba(212,175,55,0.6), 0 2px 12px rgba(0,0,0,0.9);
}

.s-amp{
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  color: #D4AF37;
  display: block;
  margin: 4px 0;
  font-style: italic;
}

.s-div{display:flex;align-items:center;gap:10px;margin:12px auto;width:min(160px,75%)}
.s-dl{flex:1;height:1px;background:linear-gradient(90deg,transparent,#D4AF37,transparent);opacity:.6}

.s-text{
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.12rem;
  color: #E6E0D4;
  line-height: 1.7;
  max-width: 300px;
  font-style: italic;
}

.s-rsvp{
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  color: #E6E0D4;
  line-height: 1.65;
  max-width: 300px;
}

.s-venue{
  font-size: 0.92rem;
  color: #F7E396;
  margin-top: 6px;
  font-weight: 500;
  max-width: 290px;
}

.s-loc{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 8px 18px;
  background: rgba(212, 175, 55, 0.12);
  border: 1px solid rgba(212, 175, 55, 0.4);
  border-radius: 25px;
  font-size: 0.78rem;
  font-weight: 600;
  color: #FFF;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  backdrop-filter: blur(5px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: all .25s ease;
}
.s-loc:active{transform:scale(.95);background:rgba(212, 175, 55, 0.25)}

.s-guest{
  font-family: 'Great Vibes', cursive;
  font-size: 3rem;
  color: #D4AF37;
  margin: 6px 0;
  text-shadow: 0 0 15px rgba(212,175,55,0.5);
}

.s-big{
  font-family: 'Cinzel', serif;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: #FFF;
  line-height: 1.5;
  text-shadow: 0 0 12px rgba(255,255,255,0.3);
}

.s-sig{
  font-family: 'Jost', sans-serif !important;
  font-size: 0.88rem !important;
  font-weight: 700 !important;
  letter-spacing: 0.16em !important;
  text-transform: uppercase !important;
  color: #D4AF37 !important;
  margin-top: 18px !important;
  padding: 10px 16px !important;
  background: linear-gradient(135deg, rgba(212,175,55,0.18) 0%, rgba(0,0,0,0.6) 100%) !important;
  border: 1px solid rgba(212,175,55,0.5) !important;
  border-radius: 8px !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 0 12px rgba(212,175,55,0.2) !important;
  text-shadow: 0 0 12px rgba(212, 175, 55, 0.8) !important;
  line-height: 1.5 !important;
}

.s-monogram {
  width: 95px;
  height: 95px;
  margin: 0 auto 12px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.s-monogram svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 12px rgba(212,175,55,0.7));
}

.mcal{
  background: rgba(18, 15, 10, 0.7) !important;
  border: 1px solid rgba(212, 175, 55, 0.4) !important;
  border-radius: 12px !important;
  padding: 12px 14px !important;
  width: 230px !important;
  margin: 12px auto 0 !important;
  backdrop-filter: blur(10px) !important;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6) !important;
}
.mcal-m{font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;color:#D4AF37 !important;text-align:center;margin-bottom:8px;letter-spacing:.1em}
.mcal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cd{font-size:.68rem;color:#D6CBBB !important;opacity:.8;padding:4px 0;border-radius:50%}
.cd.wd{font-size:.62rem;color:#D4AF37 !important;font-weight:700;opacity:1;padding-bottom:6px}
.cd.bk{visibility:hidden}
.cd.hi{background:#D4AF37 !important;color:#000 !important;font-weight:700;opacity:1;box-shadow:0 0 10px #D4AF37;border-radius:50%}

.s-cd{display:flex;gap:6px;justify-content:center;margin-top:14px}
.s-cb{
  background: linear-gradient(180deg, rgba(35,28,15,0.9) 0%, rgba(10,8,5,0.9) 100%);
  border: 1px solid rgba(212, 175, 55, 0.4);
  color:#fff;
  width:54px;
  height:54px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  position:relative;
  overflow:hidden
}
.s-cn{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:700;color:#F7E396 !important;line-height:1}
.s-cl{font-size:.42rem;letter-spacing:.08em;color:rgba(255,255,255,.6);margin-top:2px;text-transform:uppercase}
.s-cd-sep{color:#D4AF37;font-size:.8rem;opacity:.6;align-self:center;margin-bottom:6px;font-weight:300}

.s-date-card{
  display:flex;
  align-items:center;
  gap:14px;
  margin:12px auto 6px;
  background: rgba(20, 16, 10, 0.7) !important;
  border: 1px solid rgba(212, 175, 55, 0.4) !important;
  border-radius: 10px !important;
  padding: 10px 20px !important;
  backdrop-filter: blur(8px) !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
}
.s-day-num{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:700;color:#D4AF37 !important;line-height:1;border-right:1px solid rgba(212,175,55,0.25);padding-right:14px}
.s-date-r{display:flex;flex-direction:column;gap:2px;text-align:left}
.s-month-nm{font-size:.68rem;font-weight:700;letter-spacing:.2em;color:#FFF;text-transform:uppercase}
.s-year-nm{font-size:.58rem;color:#D4AF37;opacity:.8;letter-spacing:.12em}

.s-time-pill{
  font-size: 0.72rem;
  color: #FFF;
  letter-spacing: 0.18em;
  font-weight: 600;
  margin-bottom: 4px;
  background: rgba(212, 175, 55, 0.18);
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid rgba(212, 175, 55, 0.35);
}

.sc::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 50%, rgba(212,175,55,0.08) 0%, transparent 80%)}
.sc::after{content:'';position:absolute;inset:12px;border:1px solid rgba(212,175,55,0.3);border-radius:4px;pointer-events:none;z-index:1}

@keyframes goldPulse{0%,100%{filter:drop-shadow(0 0 10px rgba(212,175,55,0.5))}50%{filter:drop-shadow(0 0 22px rgba(212,175,55,0.95))}}
.s-monogram{animation:goldPulse 3.5s ease-in-out infinite,float 3.5s ease-in-out infinite}

.sc-topband{display:flex;align-items:center;gap:7px;width:74%;margin-bottom:8px}
.sc-tbl{flex:1;height:1px;background:linear-gradient(90deg,transparent,#D4AF37,transparent);opacity:.5}

.music-btn{
  position:fixed;
  bottom:22px;
  right:22px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(15,12,5,0.8);
  border:1px solid rgba(212,175,55,0.5);
  color:#D4AF37;
  font-size:1.1rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  backdrop-filter:blur(8px);
  box-shadow:0 4px 15px rgba(0,0,0,0.5), 0 0 12px rgba(212,175,55,0.3)
}

.sc>*{position:relative;z-index:3}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="vp t-nikoh" id="vp">
<div class="reel" id="reel"></div>
</div>
<div class="dots" id="dots"></div>
<div class="swipe-hint" id="shint">TEPAGA SURING</div>
<button class="music-btn" id="mb" onclick="tgl()">&#9835;</button>
<audio id="bgm" loop autoplay playsinline webkit-playsinline preload="auto" src="music.m4a"></audio>

<script>
var D={
  "type":"nikoh",
  "a":"Umidjon",
  "b":"Ezozaxon",
  "s":"Aziz",
  "eye":"TO'Y TAKLIFNOMASI",
  "tag":"Ikki qalbning bir umrga birlashuvi sharafiga sizni to'yimizga taklif qilamiz",
  "date":"2026-08-24",
  "time":"19:00",
  "venue":"\"Istiqlol\" to'yxonasi",
  "addr":"Navoiy viloyati , Xatirchi tumani , Chechak ota MFY",
  "loc":"https://maps.app.goo.gl/ZfvyF3WTAYpjC7AR7",
  "guest":"Mehmon",
  "rsvp":"Sizni ushbu qutlug' kunimizda mehmonimiz bo'lishga taklif etamiz.",
  "sig":"ZOXIDDIN OTA VA OLIM OTA OILALARI NOMIDAN"
};

var MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
var MU=MONTHS.map(function(m){return m.toUpperCase()});
var playing=false,cdTmr=null,cur=0,total=3;

var MONOGRAM_SVG = '<div class="s-monogram"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="44" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 2"/><circle cx="50" cy="50" r="38" stroke="#D4AF37" stroke-width="2"/><text x="50" y="58" text-anchor="middle" font-family="Great Vibes, cursive" font-size="34" fill="#D4AF37">U&amp;E</text></svg></div>';

function e(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function crnrs(){
  return'<svg class="sc-c tl" viewBox="0 0 60 60" fill="none"><path d="M4 28 L4 4 L28 4" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity=".8"/><circle cx="4" cy="4" r="2.5" fill="#D4AF37"/></svg>'
  +'<svg class="sc-c tr" viewBox="0 0 60 60" fill="none"><path d="M56 28 L56 4 L32 4" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity=".8"/><circle cx="56" cy="4" r="2.5" fill="#D4AF37"/></svg>'
  +'<svg class="sc-c bl" viewBox="0 0 60 60" fill="none"><path d="M4 32 L4 56 L28 56" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity=".8"/><circle cx="4" cy="56" r="2.5" fill="#D4AF37"/></svg>'
  +'<svg class="sc-c br" viewBox="0 0 60 60" fill="none"><path d="M56 32 L56 56 L32 56" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity=".8"/><circle cx="56" cy="56" r="2.5" fill="#D4AF37"/></svg>';
}

function tband(){return'<div class="sc-topband ai"><span class="sc-tbl"></span><svg viewBox="0 0 50 16" fill="none" style="width:50px;height:16px;flex-shrink:0"><path d="M25 3 L33 8 L25 13 L17 8Z" stroke="#D4AF37" stroke-width="1" fill="rgba(212,175,55,0.3)"/><circle cx="25" cy="8" r="2" fill="#FFF"/></svg><span class="sc-tbl"></span></div>'}
function sdiv(){return'<div class="s-div ai"><span class="s-dl"></span><svg viewBox="0 0 60 16" fill="none" style="width:60px;height:16px;flex-shrink:0"><path d="M30 2 L38 8 L30 14 L22 8Z" stroke="#D4AF37" stroke-width="1" fill="rgba(212,175,55,0.3)"/><circle cx="30" cy="8" r="1.8" fill="#FFF"/></svg><span class="s-dl"></span></div>'}

function cal(ds){
  if(!ds)return'';
  var d=new Date(ds+'T00:00:00'),m=d.getMonth(),y=d.getFullYear(),day=d.getDate();
  var off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  var h='<div class="mcal-m">'+MONTHS[m]+' '+y+'</div><div class="mcal-g">';
  ['Du','Se','Ch','Pa','Ju','Sh','Ya'].forEach(function(dw){h+='<div class="cd wd">'+dw+'</div>'});
  for(var i=0;i<off;i++)h+='<div class="cd bk">.</div>';
  for(var j=1;j<=dim;j++)h+='<div class="cd'+(j===day?' hi':'')+'">'+j+'</div>';
  return h+'</div>';
}

function cdh(){
  var t=new Date(D.date+'T'+(D.time||'14:00')+':00').getTime();
  var df=Math.max(0,t-Date.now());
  var vs=[Math.floor(df/86400000),Math.floor(df%86400000/3600000),Math.floor(df%3600000/60000),Math.floor(df%60000/1000)];
  var ls=['Kun','Soat','Daqiqa','Soniya'];
  return vs.map(function(nn,i){return'<div class="s-cb"><span class="s-cn">'+String(nn).padStart(2,'0')+'</span><span class="s-cl">'+ls[i]+'</span></div>'}).join('<span class="s-cd-sep">&middot;</span>');
}

function fdp(ds){
  if(!ds)return{dy:'',mo:'',yr:''};
  var d=new Date(ds+'T00:00:00');
  return{dy:d.getDate(),mo:MU[d.getMonth()],yr:d.getFullYear()};
}

function nh(){
  return'<div class="s-names ai"><span>'+e(D.a)+'</span><span class="s-amp">&amp;</span><span>'+e(D.b)+'</span></div>';
}

function buildScenes(){
  var p=fdp(D.date);
  var locBtn='<a href="'+D.loc+'" target="_blank" rel="noopener" class="s-loc ai" style="text-decoration:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="#D4AF37" style="flex-shrink:0"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg><span>Xaritada Ko\'rish</span></a>';
  
  var s1='<div class="sc">'+crnrs()+'<div class="sc-vign t"></div>'+tband()+'<div class="ai">'+MONOGRAM_SVG+'</div><div class="s-eye ai">'+e(D.eye)+'</div>'+nh()+sdiv()+'<div class="mcal ai">'+cal(D.date)+'</div><div class="sc-vign b"></div></div>';
  
  var s2='<div class="sc">'+crnrs()+'<div class="sc-vign t"></div><div class="s-eye ai">'+e(D.eye)+'</div>'+sdiv()+'<div class="s-text ai">'+e(D.tag)+'</div><div class="s-date-card ai"><span class="s-day-num">'+p.dy+'</span><div class="s-date-r"><span class="s-month-nm">'+p.mo+'</span><span class="s-year-nm">'+p.yr+'</span></div></div><div class="s-time-pill ai">SOAT '+e(D.time)+'</div><div class="s-venue ai">'+e(D.venue)+'</div>'+locBtn+'<div class="s-cd ai" id="cdbox">'+cdh()+'</div><div class="sc-vign b"></div></div>';
  
  var s3='<div class="sc">'+crnrs()+'<div class="sc-vign t"></div>'+tband()+'<div class="s-eye ai">HURMATLI MEHMON,</div><div class="s-guest-wrap ai"><div class="s-guest">'+e(D.guest)+'!</div></div><div class="s-rsvp ai">'+e(D.rsvp)+'</div>'+sdiv()+'<div class="s-big ai">TASHRIF BUYURISHINGIZNI KUTAMIZ!</div><div class="s-sig ai">'+e(D.sig)+'</div><div class="sc-vign b"></div></div>';
  
  return s1+s2+s3;
}

var reel=document.getElementById('reel');
reel.innerHTML=buildScenes();
var dotsEl=document.getElementById('dots');
for(var di=0;di<total;di++){var dd=document.createElement('div');dd.className='dot'+(di===0?' on':'');dd.dataset.i=di;dotsEl.appendChild(dd)}
dotsEl.addEventListener('click',function(ev){var t=ev.target;if(t.dataset.i!==undefined)goTo(+t.dataset.i)});

function updDots(){var ds=dotsEl.children;for(var i=0;i<ds.length;i++){ds[i].classList.toggle('on',i===cur)}}

function goTo(n){
  if(n<0||n>=total)return;
  cur=n;
  reel.style.transform='translateY(-'+(cur*100)+'%)';
  reel.classList.remove('dragging');
  updDots();
  animateScene(n);
  clearInterval(cdTmr);
  if(n===1){cdTmr=setInterval(function(){var b=document.getElementById('cdbox');if(b)b.innerHTML=cdh()},1000)}
  var hint=document.getElementById('shint');
  if(hint&&n>0){hint.style.display='none'}
}

function animateScene(n){
  var scenes=reel.querySelectorAll('.sc');
  if(!scenes[n])return;
  var items=scenes[n].querySelectorAll('.ai');
  items.forEach(function(el,i){
    el.classList.remove('vis');
    setTimeout(function(){el.classList.add('vis')},i*130+60);
  });
}

var ty0=0,ty1=0,isDragging=false;
reel.addEventListener('touchstart',function(ev){
  ty0=ev.touches[0].clientY;ty1=ty0;isDragging=true;
  reel.classList.add('dragging');
},{passive:true});

reel.addEventListener('touchmove',function(ev){
  if(!isDragging)return;
  ty1=ev.touches[0].clientY;
  var dy=ty1-ty0;
  var base=cur*reel.parentElement.offsetHeight;
  reel.style.transform='translateY('+(-base+dy)+'px)';
},{passive:true});

reel.addEventListener('touchend',function(){
  if(!isDragging)return;
  isDragging=false;
  var dy=ty1-ty0;
  if(Math.abs(dy)>50){
    if(dy<0&&cur<total-1)goTo(cur+1);
    else if(dy>0&&cur>0)goTo(cur-1);
    else goTo(cur);
  }else{goTo(cur)}
  ty0=0;ty1=0;
});

document.addEventListener('keydown',function(ev){
  if(ev.key==='ArrowDown'||ev.key===' '){ev.preventDefault();if(cur<total-1)goTo(cur+1)}
  else if(ev.key==='ArrowUp'){ev.preventDefault();if(cur>0)goTo(cur-1)}
});

var whl=false;
document.addEventListener('wheel',function(ev){
  ev.preventDefault();
  if(whl)return;whl=true;
  if(ev.deltaY>0&&cur<total-1)goTo(cur+1);
  else if(ev.deltaY<0&&cur>0)goTo(cur-1);
  setTimeout(function(){whl=false},600);
},{passive:false});

var bgm=document.getElementById('bgm'),mbEl=document.getElementById('mb');
try{bgm.volume=1}catch(e){}
function icon(){mbEl.innerHTML=(!bgm.paused&&!bgm.muted)?'&#9208;':'&#9835;'}
function loud(){bgm.muted=false;var p;try{p=bgm.play()}catch(e){return Promise.reject(e)}return(p&&p.then)?p:Promise.resolve()}
function tgl(){
  if(!bgm.paused&&!bgm.muted){bgm.pause();playing=false;icon();return}
  loud().then(function(){playing=true;icon()}).catch(function(){icon()});
}

var KEV=['pointerdown','pointerup','touchstart','touchend','touchmove','click','keydown','wheel','scroll','mousemove'],kt=null;
function stopKick(){KEV.forEach(function(ev){document.removeEventListener(ev,kick,true);window.removeEventListener(ev,kick,true)});if(kt){clearInterval(kt);kt=null}}
window.kick=kick;
function kick(){if(!bgm.paused&&!bgm.muted){stopKick();return}loud().then(function(){playing=true;icon();stopKick()}).catch(function(){})}
KEV.forEach(function(ev){document.addEventListener(ev,kick,{capture:true,passive:true});window.addEventListener(ev,kick,{capture:true,passive:true})});
document.addEventListener('visibilitychange',function(){if(!document.hidden)kick()});
window.addEventListener('focus',kick);

loud().then(function(){playing=true;icon()}).catch(function(){
  bgm.muted=true;var q=bgm.play();if(q&&q.catch)q.catch(function(){});
  icon();
  kt=setInterval(kick,500);
  setTimeout(function(){if(kt){clearInterval(kt);kt=null}},30000);
});

icon();
goTo(0);

/* --- CAFOLATLANGAN CANVAS ANIMATSIYASI (UCHALA SAHIFA UCHUN HAM ISHLAYDI) --- */
(function(){
  var canvas = document.getElementById('bgCanvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var count = 35;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  for(var i=0; i<count; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2.2 + 0.8,
      vy: -(Math.random() * 0.4 + 0.15),
      vx: (Math.random() - 0.5) * 0.2,
      alpha: Math.random() * 0.6 + 0.2,
      pulse: Math.random() * 0.02 + 0.005
    });
  }

  function render(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for(var i=0; i<particles.length; i++){
      var p = particles[i];
      p.y += p.vy;
      p.x += p.vx;
      p.alpha += Math.sin(Date.now() * p.pulse) * 0.005;

      if(p.y < -10){
        p.y = canvas.height + 10;
        p.x = Math.random() * canvas.width;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0.1, Math.min(0.8, p.alpha));
      ctx.fillStyle = '#D4AF37';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#D4AF37';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(render);
  }
  render();
})();
</script>
